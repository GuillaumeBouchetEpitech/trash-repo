<!DOCTYPE html>
<html>

    <head>

        <meta charset="UTF-8" />

        <title>Flocking</title>

        <style>
            body {
                background-color: black;
                padding: 0;
                margin: 0;
            }

            /* body {
            	background-color: rgb(63,63,63);
            } */

            #main-canvas {

                position: absolute;
                top: 0;
                left: 0;

                position: relative;
                width: 800px;
                height: 600px;

                /* centering part */
                padding-left: 0;
                padding-right: 0;
                margin-left: auto;
                margin-right: auto;
                display: block;
                /* /centering part */
            }

        </style>

    </head>

    <body>

        <canvas id="main-canvas" width="800" height="600"></canvas>

        <script src="dist/bundle.js"></script>

    </body>

</html>
